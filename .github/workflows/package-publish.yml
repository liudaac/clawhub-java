name: Package Publish

on:
  workflow_call:
    inputs:
      source:
        description: Package source to publish. Usually owner/repo, owner/repo@ref, or a GitHub URL.
        required: false
        type: string
        default: ""
      ref:
        description: Optional ref to append to the source when source is not already pinned.
        required: false
        type: string
      dry_run:
        description: Preview only. When true, no publish mutation is performed.
        required: false
        type: boolean
        default: true
      json:
        description: Emit structured JSON output.
        required: false
        type: boolean
        default: true
      registry:
        description: ClawHub registry URL.
        required: false
        type: string
        default: https://clawhub.ai
      site:
        description: ClawHub site URL.
        required: false
        type: string
        default: https://clawhub.ai
      owner:
        description: Optional owner handle override for org/shared publishing.
        required: false
        type: string
      version:
        description: Optional package version override.
        required: false
        type: string
      tags:
        description: Optional comma-separated tags override.
        required: false
        type: string
        default: latest
      source_repo:
        description: Optional source repo override for local-folder publishes.
        required: false
        type: string
      source_commit:
        description: Optional source commit override for local-folder publishes.
        required: false
        type: string
      source_ref:
        description: Optional source ref override for local-folder publishes.
        required: false
        type: string
    secrets:
      clawhub_token:
        required: false
    outputs:
      publish_json:
        description: Structured JSON output from clawhub package publish.
        value: ${{ jobs.publish.outputs.publish_json }}
      release_id:
        description: Published release id when dry_run is false.
        value: ${{ jobs.publish.outputs.release_id }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      publish_json: ${{ steps.capture.outputs.publish_json }}
      release_id: ${{ steps.capture.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate publish mode inputs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          JSON_MODE: ${{ inputs.json }}
          CLAWHUB_TOKEN: ${{ secrets.clawhub_token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$JSON_MODE" != "true" ]]; then
            echo "::warning::This reusable workflow always emits JSON output; forcing --json for downstream parsing."
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            exit 0
          fi
          if [[ -n "$CLAWHUB_TOKEN" ]]; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "No ClawHub token provided; publish will rely on GitHub OIDC trusted publishing."
            exit 0
          fi
          echo "::error::Real publishes need secrets.clawhub_token, or GitHub OIDC on workflow_dispatch runs (permissions.id-token=write)."
          exit 1

      - name: Request OIDC token
        if: ${{ secrets.clawhub_token == '' && inputs.dry_run != 'true' }}
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=clawhub" | jq -r '.value')
          echo "token=$OIDC_TOKEN" >> $GITHUB_OUTPUT

      - name: Exchange OIDC token for publish token
        if: ${{ secrets.clawhub_token == '' && inputs.dry_run != 'true' && steps.oidc.outputs.token != '' }}
        id: exchange
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"oidcToken\":\"${{ steps.oidc.outputs.token }}\"}" \
            "${{ inputs.registry }}/api/auth/oidc/token")
          PUBLISH_TOKEN=$(echo "$RESPONSE" | jq -r '.data.token')
          echo "publish_token=$PUBLISH_TOKEN" >> $GITHUB_OUTPUT

      - name: Resolve publish source
        id: source
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          source="${INPUT_SOURCE:-$GITHUB_REPOSITORY}"
          if [[ -n "$INPUT_REF" && "$source" != *"@"* ]]; then
            source="${source}@${INPUT_REF}"
          fi
          echo "source=$source" >> $GITHUB_OUTPUT

      - name: Publish package
        id: publish
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          REGISTRY: ${{ inputs.registry }}
          SITE: ${{ inputs.site }}
          OWNER: ${{ inputs.owner }}
          VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_TOKEN: ${{ secrets.clawhub_token || steps.exchange.outputs.publish_token }}
        run: |
          # Build publish payload
          PAYLOAD=$(jq -n \
            --arg source "$SOURCE" \
            --arg registry "$REGISTRY" \
            --arg site "$SITE" \
            --arg owner "$OWNER" \
            --arg version "$VERSION" \
            --arg tags "$TAGS" \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceRef "$SOURCE_REF" \
            --argjson dryRun "$DRY_RUN" \
            '{source: $source, registry: $registry, site: $site, owner: $owner, version: $version, tags: $tags, sourceRepo: $sourceRepo, sourceCommit: $sourceCommit, sourceRef: $sourceRef, dryRun: $dryRun}')

          # Call publish API
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -d "$PAYLOAD" \
            "${REGISTRY}/api/packages/publish")

          echo "$RESPONSE" | tee publish.json
          echo "publish_json=$RESPONSE" >> $GITHUB_OUTPUT
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.data.releaseId // empty')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload publish JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawhub-package-publish-json
          path: publish.json
          if-no-files-found: error
